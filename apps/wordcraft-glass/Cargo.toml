[package]
name = "wordcraft-glass"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft Glass desktop app: the WordCraft engine with the Glass front end"

[[bin]]
name = "wordcraft-glass"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-ui-glass = { path = "../../crates/ui-glass" }
wordcraft-control-key = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# The host modules below are shared with apps/wordcraft (see `src/main.rs`), so they need the same
# platform crates, at the same versions and features.
[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSApplication"] }
objc2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["UI_ViewManagement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
pollster = "0.4"
arboard = { workspace = true, features = ["image-data"] }
getrandom = "0.3"
open = "5.4"
